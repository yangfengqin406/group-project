name: project-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - run: npm run build:app
        env:
          CAMPUS_APP_ORIGIN: https://example.invalid
      - run: npm run check:mp-styles
      - run: npm run check:mp-quality
      - run: node scripts/check-weixin-package.mjs
      - run: node scripts/build-release.mjs
      - run: node scripts/check-weixin-styles.mjs dist/release/mp-weixin
      - run: node scripts/check-weixin-quality.mjs dist/release/mp-weixin
      - run: node scripts/check-weixin-package.mjs dist/release/mp-weixin
