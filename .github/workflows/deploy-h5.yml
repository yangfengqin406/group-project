name: deploy-h5-demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_API_MODE: mock
      VITE_API_BASE_URL: ''
      VITE_WECHAT_TEMPLATE_IDS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:mp-weixin
      - run: npm run check:mp-styles
      - run: npm run check:mp-quality
      - run: node scripts/check-weixin-package.mjs
      - name: Build H5 for the project Pages path
        run: npm run build:h5
        env:
          UNI_H5_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/build/h5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish H5 demo
        id: deployment
        uses: actions/deploy-pages@v4
