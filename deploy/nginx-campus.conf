# Replace domain and certificate paths before installing this server block.
# The application listens ONLY on loopback; do not expose 8788 publicly.
server {
    listen 80;
    server_name campus.example.com;
    return 301 https://campus.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name campus.example.com;
    ssl_certificate /etc/letsencrypt/live/campus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite externally supplied forwarding headers at the only edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
